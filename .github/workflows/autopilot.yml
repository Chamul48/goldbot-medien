name: Shopify Autopilot

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  push:
    branches: [main]
    paths: ["social/**"]   # new reel pushed -> run right away
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: shopify-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python -m shopify_agent --autopilot --media-dir social --out-dir autopilot

      - name: Save report and state
        if: always()
        run: |
          git config user.name "shopify-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add autopilot
          git diff --cached --quiet || git commit -m "Autopilot $(date -u +%F)"
          git pull --rebase && git push

      - name: Notify owner when needed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f autopilot/ESCALATIONS.md ]; then
            gh issue create --title "Shop braucht dich: $(date -u +%F)" --body-file autopilot/ESCALATIONS.md
          fi

      - name: Notify owner on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Autopilot fehlgeschlagen: $(date -u +%F)" \
            --body "Der Autopilot-Lauf ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
